    "Win32_System_WinRT",
    "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging", "Win32_Storage_Packaging_Appx",
    "Win32_System_RemoteDesktop",
] }
